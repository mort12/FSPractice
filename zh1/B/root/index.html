<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Character details</title>
    <meta name="description" content="Character details">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./styles/bootstrap.min.css">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <div id="main">
        <div id="characters">
            <h1>Characters</h1>
            <ul id="character-list"></ul>
        </div>
        <div id="details">
            <h1>Details</h1>
            <div class="input-group mb-1">
                <span class="input-group-text">Name</span>
                <label id="name" class="form-control"></label>
            </div>
            <div class="input-group mb-1">
                <span class="input-group-text">Tribe</span>
                <label id="tribe" class="form-control"></label>
            </div>
            <div class="input-group mb-1">
                <span class="input-group-text">Weapon</span>
                <label id="weapon" class="form-control"></label>
            </div>
            <div class="input-group mb-1">
                <span class="input-group-text">Animal</span>
                <label id="animal" class="form-control"></label>
            </div>
            <div class="input-group mb-1">
                <span class="input-group-text">Score</span>
                <label id="score" class="form-control"></label>
            </div>
        </div>
        <div id="favorites">
            <h1>Favorites</h1>
            <ul id="favorite-list"></ul>
        </div>
        <div id="appearance">
            PLACEHOLDER
        </div>
</body>

</html>
