<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Smartphones</title>
    <meta name="description" content="Smartphones">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./styles/bootstrap.min.css">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <h1>Smartphones</h1>
    <div id="smartphones-creation">
        <h3>Create a new smartphone</h3>
        <form id="smartphone-creation-form">
            <div class="form-group">
                <label for="id">ID</label>
                <input type="text" class="form-control" id="id" disabled>
                <label for="model">Model</label>
                <input type="text" class="form-control" id="model" placeholder="Enter model">
                <label for="price">Price</label>
                <input type="text" class="form-control" id="price" placeholder="Enter price">
                <label for="screenSize">Screen Size</label>
                <input type="text" class="form-control" id="screenSize" placeholder="Enter screen size">
                <label for="rating">Rating</label>
                <input type="text" class="form-control" id="rating" placeholder="Enter rating">
                <label for="available">Available</label>
                <input type="checkbox" class="form-check-input" id="available" name="availability" value="available">
                <br>
                <submit class="btn btn-success" id="create-smartphone-btn" onclick="createSmartphone()">Create</submit>
                <submit class="btn btn-warning" id="update-smartphone-btn" onclick="updateSmartphone()">Update</submit>
                <submit class="btn btn-primary" id="reset-smartphone-btn" onclick="resetForm()">Reset</submit>
            </div>
        </form>
    </div>
    <div id="smartphones-list-view">
        <h3>Smartphone list</h3>
        <table id="smartphone-list" class="table table-hover">
            <thead id="smartphone-list-head">
                <tr>
                    <th>Model</th>
                    <th>Price</th>
                    <th>Screensize</th>
                    <th>Rating</th>
                    <th>Availability</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="smartphone-list-body">
            </tbody>
        </table>
    </div>

    <script src="./scripts/app.js"></script>
</body>

</html>
