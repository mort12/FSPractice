<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>In crust we trust</title>
    <meta name="description" content="Orders, orders, orders">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./styles/bootstrap.min.css">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>
    <div id="order-action">
        <form id="order-form" onsubmit="return false;">
            <div class="mb-3">
                <label for="order-id" class="form-label">ID</label>
                <input type="text" class="form-control" id="order-id" readonly disabled>
            </div>
            <div class="mb-3">
                <label for="order-customer" class="form-label">Customer</label>
                <input type="text" class="form-control" id="order-customer" required>
            </div>
            <div class="mb-3">
                <label for="order-address" class="form-label">Address</label>
                <input type="text" class="form-control" id="order-address" required>
            </div>
            <div class="mb-3">
                <label for="order-item" class="form-label">Item</label>
                <input type="text" class="form-control" id="order-item" required>
            </div>
            <div class="mb-3">
                <label for="order-quantity" class="form-label">Quantity</label>
                <input type="number" step="1" class="form-control" id="order-quantity" required>
            </div>
            <button type="button" id="reset-button" class="btn btn-info" onclick="resetForm()">Reset</button>
            <button type="button" id="create-button" class="btn btn-success" onclick="createOrder()">Create order</button>
            <button type="button" id="update-button" class="btn btn-warning" onclick="updateOrder()">Update order</button>
            <button type="button" id="delete-button" class="btn btn-danger" onclick="deleteOrder()">Delete order</button>
        </form>
    </div>
    <div id="order-list">
        <hr>
        <h3>Orders</h3>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Customer</th>
                    <th>Address</th>
                    <th>Item</th>
                    <th>Quantity</th>
                </tr>
            <tbody id="order-list-table-body">
            </tbody>
        </table>
    </div>

    <script src="./scripts/app.js" async defer></script>
</body>

</html>
